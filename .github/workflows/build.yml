name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: xcodebuild -version && sw_vers

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild -project MuseApp.xcodeproj -target MuseApp \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log

      - name: Résumé des erreurs
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100 || true
