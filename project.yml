name: MuseApp
options:
  bundleIdPrefix: com.sebastiengagneur
  deploymentTarget:
    iOS: "16.0"
targets:
  MuseApp:
    type: application
    platform: iOS
    sources: [MuseApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebastiengagneur.museapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Muse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Pour filmer et envoyer des vidéos sur muse.ai."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pour enregistrer le son de vos vidéos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pour choisir des vidéos à envoyer sur muse.ai."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
